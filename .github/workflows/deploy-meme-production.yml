name: Deploy Meme Cooking Production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable corepack
        run: corepack enable

      - name: Install step
        run: "yarn install --immutable"

      - name: Copy Charting Library files
        run: "./copy_charting_library_files.sh"

      - name: Svelte Check
        run: "yarn workspace meme-cooking run check"

      - name: Add app name to .env
        run: echo "VITE_APP_NAME=Meme.Cooking" >> apps/meme-cooking/.env.production

      - name: Add contract connect ID to .env
        run: echo "VITE_APP_LOGO=https://raw.githubusercontent.com/Shitzu-Apes/brand-kit/main/logo/meme-cooking.webp" >> apps/meme-cooking/.env.production

      - name: Add commit hash to .env
        run: echo "VITE_COMMIT_HASH=\"${{ github.sha }}\"" >> apps/meme-cooking/.env.production

      - name: Add contract connect ID to .env
        run: echo "VITE_CONNECT_ID=meme-cooking.near" >> apps/meme-cooking/.env.production

      - name: Add multichain wallet selector to .env
        run: echo "VITE_WALLET_SELECTOR_MULTICHAIN=true" >> apps/meme-cooking/.env.production

      - name: Hide EVM wallet option to .env
        run: echo "VITE_WALLET_SELECTOR_EVM=false" >> apps/meme-cooking/.env.production

      - name: Add Pinate JWT to .env
        run: echo "PINATA_JWT=$PINATA_JWT" >> apps/meme-cooking/.env.production
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}

      - name: Add Endpoint secret to .env
        run: echo "ENDPOINT_SECRET=$ENDPOINT_SECRET" >> apps/meme-cooking/.env.production
        env:
          ENDPOINT_SECRET: ${{ secrets.ENDPOINT_SECRET_MAINNET }}

      - name: Add account ID to .env
        run: echo "ACCOUNT_ID=$ACCOUNT_ID" >> apps/meme-cooking/.env.production
        env:
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID_MAINNET }}

      - name: Add private key to .env
        run: echo "PRIVATE_KEY=$PRIVATE_KEY" >> apps/meme-cooking/.env.production
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_MAINNET }}

      - name: Add WalletConnect project ID to .env
        run: echo "VITE_WC_PROJECT_ID=44dd0ed9ce175eeb72a67532fbfb6f96" >> apps/meme-cooking/.env.production

      # The public mainnet cluster answers 403 "Access forbidden" to browser
      # origins, which breaks every Solana read on the site.
      - name: Add Solana RPC URL to .env
        run: echo "VITE_SOLANA_RPC_URL=$VITE_SOLANA_RPC_URL" >> apps/meme-cooking/.env.production
        env:
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}

      # - name: Add Near RPC URL to .env
      #   run: echo "VITE_NODE_URL=$VITE_NODE_URL" >> apps/meme-cooking/.env.production.local
      #   env:
      #     VITE_NODE_URL: ${{ secrets.VITE_NODE_URL }}

      - name: Build step
        run: "yarn vite build --mode production"
        working-directory: apps/meme-cooking

      - name: Lint
        run: "yarn lint"

      - name: Upload to Cloudflare Pages
        run: yarn wrangler pages deploy --project-name meme-cooking-production .svelte-kit/cloudflare
        working-directory: apps/meme-cooking
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
